<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - GigHub</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
      background-size: 400% 400%;
      animation: gradient 15s ease infinite;
      position: relative;
      overflow-y: auto;
      overflow-x: hidden;
    }

    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Floating shapes */
    body::before,
    body::after {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      animation: float 20s infinite;
    }

    body::before {
      top: -100px;
      left: -100px;
    }

    body::after {
      bottom: -100px;
      right: -100px;
      animation-delay: -10s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(50px, -50px) scale(1.1); }
      66% { transform: translate(-50px, 50px) scale(0.9); }
    }

    .container {
      max-width: 480px;
      width: 100%;
      position: relative;
      z-index: 1;
      margin: auto;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 3rem 2.5rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3),
                  0 0 0 1px rgba(255, 255, 255, 0.5) inset;
      border: 1px solid rgba(255, 255, 255, 0.3);
      transform: translateY(0);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      max-height: 90vh;
      overflow-y: auto;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35),
                  0 0 0 1px rgba(255, 255, 255, 0.5) inset;
    }

    .logo {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo-icon {
      font-size: 4rem;
      margin-bottom: 0.5rem;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .logo h1 {
      font-size: 2.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
      letter-spacing: -1px;
    }

    .logo p {
      color: #666;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 2rem;
      background: #f0f0f0;
      padding: 0.35rem;
      border-radius: 12px;
    }

    .tab {
      flex: 1;
      padding: 0.85rem;
      background: transparent;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      color: #666;
      position: relative;
      overflow: hidden;
    }

    .tab::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      opacity: 0;
      transition: opacity 0.3s ease;
      border-radius: 10px;
    }

    .tab.active {
      color: white;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .tab.active::before {
      opacity: 1;
    }

    .tab span {
      position: relative;
      z-index: 1;
    }

    .form-group {
      margin-bottom: 1.5rem;
      position: relative;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: #333;
      font-size: 0.9rem;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 0.9rem 1rem;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 1rem;
      transition: all 0.3s ease;
      background: white;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
      transform: translateY(-2px);
    }

    .form-group input::placeholder {
      color: #999;
    }

    .btn {
      width: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 1rem;
      border: none;
      border-radius: 12px;
      font-size: 1.05rem;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-weight: 700;
      margin-top: 1rem;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: left 0.5s ease;
    }

    .btn:hover::before {
      left: 100%;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
    }

    .btn:active {
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .hidden {
      display: none;
    }

    .alert {
      padding: 1rem 1.25rem;
      border-radius: 12px;
      margin-bottom: 1.5rem;
      font-weight: 500;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .alert-success {
      background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
      color: #155724;
      border: 1px solid #b1dfbb;
    }

    .alert-error {
      background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
      color: #721c24;
      border: 1px solid #f1b0b7;
    }

    .role-selection {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .role-option {
      padding: 1.25rem 1rem;
      border: 2px solid #e0e0e0;
      border-radius: 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      background: white;
      position: relative;
      overflow: hidden;
    }

    .role-option::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .role-option:hover {
      border-color: #667eea;
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.2);
    }

    .role-option:hover::before {
      opacity: 1;
    }

    .role-option.selected {
      border-color: #667eea;
      background: white;
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
    }

    .role-option.selected::before {
      opacity: 1;
    }

    .role-option h3 {
      margin-bottom: 0.5rem;
      color: #667eea;
      font-size: 1.1rem;
      font-weight: 700;
      position: relative;
      z-index: 1;
    }

    .role-option p {
      font-size: 0.8rem;
      color: #666;
      position: relative;
      z-index: 1;
    }

    .back-link {
      text-align: center;
      margin-top: 1.5rem;
    }

    .back-link a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
      display: inline-block;
    }

    .back-link a:hover {
      color: #764ba2;
      transform: translateX(-5px);
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 1.5rem 0;
      color: #999;
      font-size: 0.85rem;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e0e0e0;
    }

    .divider::before {
      margin-right: 1rem;
    }

    .divider::after {
      margin-left: 1rem;
    }

    /* Custom scrollbar for the card */
    .card::-webkit-scrollbar {
      width: 8px;
    }

    .card::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.05);
      border-radius: 10px;
    }

    .card::-webkit-scrollbar-thumb {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 10px;
    }

    .card::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
    }

    @media (max-width: 480px) {
      body {
        align-items: flex-start;
        padding: 0.5rem;
      }

      .container {
        margin: 0.5rem auto;
      }

      .card {
        padding: 1.5rem 1.25rem;
        max-height: 95vh;
      }

      .logo h1 {
        font-size: 2rem;
      }

      .logo-icon {
        font-size: 3rem;
      }

      .role-selection {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="logo">
        <div class="logo-icon">🚀</div>
        <h1>GigHub</h1>
        <p>Where Talent Meets Opportunity</p>
      </div>

      <div id="alertContainer"></div>

      <div class="tabs">
        <button class="tab active" onclick="showLogin()"><span>Login</span></button>
        <button class="tab" onclick="showSignup()"><span>Sign Up</span></button>
      </div>

      <!-- Login Form -->
      <div id="loginForm">
        <form onsubmit="handleLogin(event)">
          <div class="form-group">
            <label>Phone Number *</label>
            <input type="tel" id="loginPhone" placeholder="+919876543210" required>
          </div>
          <div class="form-group">
            <label>Password *</label>
            <input type="password" id="loginPassword" placeholder="Enter your password" required>
          </div>
          <button type="submit" class="btn">Login</button>
        </form>
      </div>

      <!-- Signup Form -->
      <div id="signupForm" class="hidden">
        <form onsubmit="handleSignup(event)">
          <div class="form-group">
            <label>Full Name *</label>
            <input type="text" id="signupName" placeholder="John Doe" required>
          </div>
          <div class="form-group">
            <label>Phone Number *</label>
            <input type="tel" id="signupPhone" placeholder="+919876543210" required>
          </div>
          <div class="form-group">
            <label>Email (optional)</label>
            <input type="email" id="signupEmail" placeholder="john@example.com">
          </div>
          <div class="form-group">
            <label>Password *</label>
            <input type="password" id="signupPassword" placeholder="Minimum 6 characters" required minlength="6">
          </div>
          <div class="form-group">
            <label>I want to *</label>
            <div class="role-selection">
              <div class="role-option selected" onclick="selectRole('user')">
                <h3>📝 Post Work</h3>
                <p>I need creative services</p>
              </div>
              <div class="role-option" onclick="selectRole('creator')">
                <h3>🎨 Create</h3>
                <p>I offer creative services</p>
              </div>
            </div>
            <input type="hidden" id="signupRole" value="user">
          </div>
          <button type="submit" class="btn">Create Account</button>
        </form>
      </div>

      <div class="back-link">
        <a href="/">← Back to Home</a>
      </div>
    </div>
  </div>

  <script>
    const API_URL = window.location.origin;

    function showAlert(message, type = 'error') {
      const alertContainer = document.getElementById('alertContainer');
      alertContainer.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
      setTimeout(() => {
        alertContainer.innerHTML = '';
      }, 5000);
    }

    function showLogin() {
      document.getElementById('loginForm').classList.remove('hidden');
      document.getElementById('signupForm').classList.add('hidden');
      document.querySelectorAll('.tab')[0].classList.add('active');
      document.querySelectorAll('.tab')[1].classList.remove('active');
    }

    function showSignup() {
      document.getElementById('loginForm').classList.add('hidden');
      document.getElementById('signupForm').classList.remove('hidden');
      document.querySelectorAll('.tab')[0].classList.remove('active');
      document.querySelectorAll('.tab')[1].classList.add('active');
    }

    function selectRole(role) {
      document.getElementById('signupRole').value = role;
      document.querySelectorAll('.role-option').forEach(opt => {
        opt.classList.remove('selected');
      });
      event.currentTarget.classList.add('selected');
    }

    async function handleLogin(e) {
      e.preventDefault();
      
      const phone = document.getElementById('loginPhone').value.trim();
      const password = document.getElementById('loginPassword').value;

      try {
        const response = await fetch(`${API_URL}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, password })
        });

        const data = await response.json();

        if (response.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          showAlert('Login successful! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = '/';
          }, 1000);
        } else {
          showAlert(data.error || 'Login failed');
        }
      } catch (err) {
        showAlert('Network error. Please try again.');
      }
    }

    async function handleSignup(e) {
      e.preventDefault();
      
      const name = document.getElementById('signupName').value.trim();
      const phone = document.getElementById('signupPhone').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const password = document.getElementById('signupPassword').value;
      const role = document.getElementById('signupRole').value;

      try {
        const response = await fetch(`${API_URL}/api/auth/signup`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, phone, email, password, role })
        });

        const data = await response.json();

        if (response.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          showAlert('Account created successfully!', 'success');
          
          // Redirect creators to profile completion page
          setTimeout(() => {
            if (role === 'creator') {
              window.location.href = '/complete-profile';
            } else {
              window.location.href = '/';
            }
          }, 1000);
        } else {
          showAlert(data.error || 'Signup failed');
        }
      } catch (err) {
        showAlert('Network error. Please try again.');
      }
    }

    // Check if already logged in
    const token = localStorage.getItem('token');
    if (token) {
      window.location.href = '/';
    }
  </script>
</body>
</html>
