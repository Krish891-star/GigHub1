<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GigHub - Login & Signup</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="/icon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icon-16x16.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/icon-192x192.png">
  <meta name="theme-color" content="#667eea">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 450px;
    }

    .logo {
      text-align: center;
      color: white;
      margin-bottom: 30px;
    }

    .logo h1 {
      font-size: 3rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .logo p {
      font-size: 1.1rem;
      opacity: 0.9;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 40px 30px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }

    .tab {
      flex: 1;
      padding: 12px;
      border: none;
      background: #f0f0f0;
      color: #666;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .tab.active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .form-container {
      display: none;
    }

    .form-container.active {
      display: block;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
      font-size: 0.9rem;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 1rem;
      transition: all 0.3s;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    .btn:active {
      transform: translateY(0);
    }

    .alert {
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: none;
      font-size: 0.9rem;
    }

    .alert.error {
      background: #fee;
      color: #c33;
      border: 1px solid #fcc;
      display: block;
    }

    .alert.success {
      background: #efe;
      color: #3c3;
      border: 1px solid #cfc;
      display: block;
    }

    .divider {
      text-align: center;
      margin: 20px 0;
      position: relative;
      color: #999;
    }

    .divider::before,
    .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 45%;
      height: 1px;
      background: #e0e0e0;
    }

    .divider::before {
      left: 0;
    }

    .divider::after {
      right: 0;
    }

    .features {
      margin-top: 30px;
      padding-top: 30px;
      border-top: 1px solid #e0e0e0;
    }

    .feature {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 15px;
      color: #666;
      font-size: 0.9rem;
    }

    .feature i {
      color: #667eea;
      font-size: 1.2rem;
      width: 24px;
    }

    @media (max-width: 480px) {
      .logo h1 {
        font-size: 2.5rem;
      }

      .card {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <h1><i class="fas fa-rocket"></i> GigHub</h1>
      <p>Connect. Create. Collaborate.</p>
    </div>

    <div class="card">
      <div class="tabs">
        <button class="tab active" onclick="switchTab('login')">
          <i class="fas fa-sign-in-alt"></i> Login
        </button>
        <button class="tab" onclick="switchTab('signup')">
          <i class="fas fa-user-plus"></i> Signup
        </button>
      </div>

      <div id="alert" class="alert"></div>

      <!-- Login Form -->
      <div id="loginForm" class="form-container active">
        <form onsubmit="handleLogin(event)">
          <div class="form-group">
            <label><i class="fas fa-phone"></i> Phone Number</label>
            <input type="tel" id="loginPhone" placeholder="Enter your phone number" required>
          </div>

          <div class="form-group">
            <label><i class="fas fa-lock"></i> Password</label>
            <input type="password" id="loginPassword" placeholder="Enter your password" required>
          </div>

          <button type="submit" class="btn">
            <i class="fas fa-sign-in-alt"></i> Login
          </button>
        </form>

        <div class="features">
          <div class="feature">
            <i class="fas fa-check-circle"></i>
            <span>Access your dashboard and posts</span>
          </div>
          <div class="feature">
            <i class="fas fa-check-circle"></i>
            <span>Connect with creators and clients</span>
          </div>
          <div class="feature">
            <i class="fas fa-check-circle"></i>
            <span>Manage notifications and bookmarks</span>
          </div>
        </div>
      </div>

      <!-- Signup Form -->
      <div id="signupForm" class="form-container">
        <form onsubmit="handleSignup(event)">
          <div class="form-group">
            <label><i class="fas fa-user"></i> Full Name</label>
            <input type="text" id="signupName" placeholder="Enter your full name" required>
          </div>

          <div class="form-group">
            <label><i class="fas fa-phone"></i> Phone Number</label>
            <input type="tel" id="signupPhone" placeholder="Enter your phone number" required>
          </div>

          <div class="form-group">
            <label><i class="fas fa-envelope"></i> Email (Optional)</label>
            <input type="email" id="signupEmail" placeholder="Enter your email">
          </div>

          <div class="form-group">
            <label><i class="fas fa-lock"></i> Password</label>
            <input type="password" id="signupPassword" placeholder="Create a password" required minlength="6">
          </div>

          <div class="form-group">
            <label><i class="fas fa-user-tag"></i> I am a...</label>
            <select id="signupRole" required>
              <option value="">Select your role</option>
              <option value="user">Client - I need work done</option>
              <option value="creator">Creator - I do creative work</option>
            </select>
          </div>

          <button type="submit" class="btn">
            <i class="fas fa-user-plus"></i> Create Account
          </button>
        </form>

        <div class="features">
          <div class="feature">
            <i class="fas fa-check-circle"></i>
            <span>Post projects or showcase your work</span>
          </div>
          <div class="feature">
            <i class="fas fa-check-circle"></i>
            <span>Follow creators and get discovered</span>
          </div>
          <div class="feature">
            <i class="fas fa-check-circle"></i>
            <span>Free to use, no credit card required</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = window.location.origin;

    function switchTab(tab) {
      const tabs = document.querySelectorAll('.tab');
      const loginForm = document.getElementById('loginForm');
      const signupForm = document.getElementById('signupForm');
      const alert = document.getElementById('alert');

      alert.className = 'alert';
      alert.textContent = '';

      tabs.forEach(t => t.classList.remove('active'));

      if (tab === 'login') {
        tabs[0].classList.add('active');
        loginForm.classList.add('active');
        signupForm.classList.remove('active');
      } else {
        tabs[1].classList.add('active');
        signupForm.classList.add('active');
        loginForm.classList.remove('active');
      }
    }

    function showAlert(message, type = 'error') {
      const alert = document.getElementById('alert');
      alert.textContent = message;
      alert.className = `alert ${type}`;
      setTimeout(() => {
        alert.className = 'alert';
      }, 5000);
    }

    async function handleLogin(event) {
      event.preventDefault();

      const phone = document.getElementById('loginPhone').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (!phone || !password) {
        showAlert('Please fill in all fields');
        return;
      }

      try {
        const response = await fetch(`${API_URL}/api/auth/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ phone, password })
        });

        const data = await response.json();

        if (response.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          showAlert('Login successful! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = '/';
          }, 1000);
        } else {
          showAlert(data.error || 'Login failed');
        }
      } catch (err) {
        showAlert('Network error. Please try again.');
      }
    }

    async function handleSignup(event) {
      event.preventDefault();

      const name = document.getElementById('signupName').value.trim();
      const phone = document.getElementById('signupPhone').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const password = document.getElementById('signupPassword').value;
      const role = document.getElementById('signupRole').value;

      if (!name || !phone || !password || !role) {
        showAlert('Please fill in all required fields');
        return;
      }

      if (password.length < 6) {
        showAlert('Password must be at least 6 characters');
        return;
      }

      try {
        const response = await fetch(`${API_URL}/api/auth/signup`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ name, phone, email, password, role })
        });

        const data = await response.json();

        if (response.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          showAlert('Account created! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = role === 'creator' ? '/complete-profile.html' : '/';
          }, 1000);
        } else {
          showAlert(data.error || 'Signup failed');
        }
      } catch (err) {
        showAlert('Network error. Please try again.');
      }
    }

    // Check if already logged in
    window.addEventListener('DOMContentLoaded', () => {
      const token = localStorage.getItem('token');
      const user = localStorage.getItem('user');
      
      if (token && user) {
        window.location.href = '/';
      }
    });
  </script>
</body>
</html>
