<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GigHub - Freelance Marketplace</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --ig-primary: #405DE6;
      --ig-secondary: #5851DB;
      --ig-gradient: linear-gradient(45deg, #405DE6, #5851DB, #833AB4, #C13584, #E1306C, #FD1D1D);
      --bg-primary: #fafafa;
      --bg-secondary: #ffffff;
      --text-primary: #262626;
      --text-secondary: #8e8e8e;
      --border-color: #dbdbdb;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      padding-bottom: 60px;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Instagram-style Top Navbar */
    .top-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      z-index: 1000;
    }

    .nav-logo {
      font-size: 1.5rem;
      font-weight: 700;
      background: var(--ig-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s;
    }

    .nav-logo:hover {
      transform: scale(1.05);
    }

    .nav-icons {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .nav-icon {
      font-size: 1.4rem;
      cursor: pointer;
      color: var(--text-primary);
      transition: transform 0.2s;
      position: relative;
      user-select: none;
    }

    .nav-icon:hover {
      transform: scale(1.15);
    }

    .nav-icon:active {
      transform: scale(0.95);
    }

    .nav-icon.active {
      background: var(--ig-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Stories Bar */
    .stories-bar {
      margin-top: 60px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 0;
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .stories-bar::-webkit-scrollbar {
      display: none;
    }

    .stories-container {
      display: flex;
      gap: 15px;
      padding: 0 20px;
      width: max-content;
    }

    .story-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }

    .story-avatar {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      background: var(--ig-gradient);
      padding: 3px;
      margin-bottom: 6px;
    }

    .story-avatar img,
    .story-avatar .avatar-placeholder {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 3px solid var(--bg-secondary);
      object-fit: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      font-weight: 700;
      font-size: 1.5rem;
    }

    .story-username {
      font-size: 0.75rem;
      color: var(--text-primary);
      max-width: 70px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Main Feed */
    .feed-container {
      max-width: 600px;
      margin: 20px auto;
      padding: 0 20px;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }

    /* Instagram-style Post Card */
    .post-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .post-header {
      display: flex;
      align-items: center;
      padding: 14px;
      gap: 12px;
    }

    .post-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .post-user-info {
      flex: 1;
    }

    .post-username {
      font-weight: 600;
      font-size: 0.9rem;
    }

    .post-category {
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .post-image {
      width: 100%;
      max-height: 600px;
      object-fit: cover;
    }

    .post-actions {
      display: flex;
      justify-content: space-between;
      padding: 12px 14px;
    }

    .post-actions-left {
      display: flex;
      gap: 16px;
    }

    .action-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-primary);
      transition: transform 0.2s;
    }

    .action-btn:hover {
      transform: scale(1.1);
    }

    .action-btn.liked {
      color: #ed4956;
    }

    .post-likes {
      padding: 0 14px;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 8px;
    }

    .post-caption {
      padding: 0 14px;
      margin-bottom: 8px;
      line-height: 1.5;
    }

    .post-caption strong {
      margin-right: 6px;
    }

    .post-budget {
      padding: 0 14px;
      font-weight: 700;
      font-size: 1.1rem;
      background: var(--ig-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .post-comments {
      padding: 0 14px;
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .post-time {
      padding: 0 14px 14px;
      font-size: 0.75rem;
      color: var(--text-secondary);
      text-transform: uppercase;
    }

    .post-contact {
      padding: 14px;
      border-top: 1px solid var(--border-color);
      background: #fafafa;
    }

    .contact-btn {
      display: inline-block;
      padding: 8px 16px;
      background: var(--ig-gradient);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      margin-right: 8px;
      margin-bottom: 8px;
    }

    /* Bottom Navigation (Mobile) */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
    }

    .bottom-nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      color: var(--text-primary);
      transition: transform 0.2s;
      user-select: none;
      padding: 8px 12px;
      border-radius: 8px;
    }

    .bottom-nav-item:hover {
      transform: scale(1.1);
      background: rgba(64, 93, 230, 0.1);
    }

    .bottom-nav-item:active {
      transform: scale(0.9);
    }

    .bottom-nav-item.active {
      background: var(--ig-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .bottom-nav-item i {
      font-size: 1.5rem;
      margin-bottom: 4px;
    }

    .bottom-nav-item span {
      font-size: 0.7rem;
    }

    /* Sections */
    .section {
      display: none;
    }

    .section.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Explore Grid */
    .explore-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 20px;
    }

    .explore-item {
      position: relative;
      aspect-ratio: 1;
      overflow: hidden;
      cursor: pointer;
    }

    .explore-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }

    .explore-item:hover img {
      transform: scale(1.05);
    }

    .explore-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      opacity: 0;
      transition: opacity 0.3s;
      color: white;
      font-weight: 600;
    }

    .explore-item:hover .explore-overlay {
      opacity: 1;
    }

    /* Profile Section */
    .profile-header {
      background: var(--bg-secondary);
      padding: 30px 20px;
      border-bottom: 1px solid var(--border-color);
    }

    .profile-info {
      display: flex;
      align-items: center;
      gap: 30px;
      max-width: 600px;
      margin: 0 auto;
    }

    .profile-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 3rem;
      font-weight: 700;
    }

    .profile-stats {
      flex: 1;
    }

    .profile-username {
      font-size: 1.3rem;
      font-weight: 300;
      margin-bottom: 10px;
    }

    .profile-stats-row {
      display: flex;
      gap: 30px;
      margin-bottom: 10px;
    }

    .stat-item {
      text-align: center;
    }

    .stat-number {
      font-weight: 600;
      font-size: 1.1rem;
    }

    .stat-label {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .profile-bio {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    .profile-name {
      font-weight: 600;
      margin-bottom: 8px;
    }

    .profile-bio-text {
      line-height: 1.5;
      margin-bottom: 12px;
    }

    /* Forms */
    .form-container {
      max-width: 600px;
      margin: 80px auto 20px;
      background: var(--bg-secondary);
      padding: 30px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.95rem;
      background: #fafafa;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: #a8a8a8;
    }

    .btn-primary {
      width: 100%;
      padding: 12px;
      background: var(--ig-gradient);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Alert Messages */
    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-weight: 600;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .alert-success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .alert-error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    /* Dark Mode Styles */
    body.dark-mode {
      --bg-primary: #121212;
      --bg-secondary: #1e1e1e;
      --text-primary: #e0e0e0;
      --text-secondary: #a0a0a0;
      --border-color: #333333;
    }

    body.dark-mode .top-nav {
      background: #1e1e1e;
      border-bottom-color: #333;
    }

    body.dark-mode .stories-bar {
      background: #1e1e1e;
      border-bottom-color: #333;
    }

    body.dark-mode .post-card {
      background: #1e1e1e;
      border-color: #333;
    }

    body.dark-mode .post-contact {
      background: #2a2a2a;
      border-top-color: #333;
    }

    body.dark-mode .form-container {
      background: #1e1e1e;
      border-color: #333;
    }

    body.dark-mode .form-group input,
    body.dark-mode .form-group textarea,
    body.dark-mode .form-group select {
      background: #2a2a2a;
      border-color: #333;
      color: #e0e0e0;
    }

    body.dark-mode .form-group input:focus,
    body.dark-mode .form-group textarea:focus,
    body.dark-mode .form-group select:focus {
      border-color: #555;
    }

    body.dark-mode .action-btn {
      color: #e0e0e0;
    }

    body.dark-mode .bottom-nav {
      background: #1e1e1e;
      border-top-color: #333;
    }

    body.dark-mode .modal-content {
      background: #1e1e1e;
    }

    body.dark-mode .alert-success {
      background: #1b4332;
      color: #95d5b2;
      border-color: #2d6a4f;
    }

    body.dark-mode .alert-error {
      background: #5c1a1a;
      color: #f5a3a3;
      border-color: #8b2f2f;
    }

    /* Bookmark Button */
    .action-btn.bookmarked {
      color: #405DE6;
    }

    /* Notification Badge */
    .notification-badge {
      position: absolute;
      top: -8px;
      right: -8px;
      background: #E1306C;
      color: white;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      font-size: 0.65rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid white;
    }

    body.dark-mode .notification-badge {
      border-color: #1e1e1e;
    }

    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 2000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: var(--bg-secondary);
      padding: 24px;
      border-radius: 12px;
      width: 90%;
      max-width: 500px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }

    body.dark-mode .modal-content {
      background: #1e1e1e;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text-secondary);
    }

    /* Desktop Responsive */
    @media (min-width: 768px) {
      .bottom-nav {
        display: none;
      }

      body {
        padding-bottom: 20px;
      }
      
      .feed-container {
        max-width: 600px;
      }
    }
    
    /* Tablet Responsive */
    @media (max-width: 1024px) and (min-width: 768px) {
      .feed-container {
        max-width: 90%;
      }
      
      .explore-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    /* Mobile Responsive */
    @media (max-width: 767px) {
      .feed-container {
        padding: 0;
        margin: 10px auto;
        width: 100%;
        overflow-x: hidden;
      }

      .post-card {
        border-radius: 0;
        border-left: none;
        border-right: none;
        margin-bottom: 10px;
      }

      .form-container {
        margin: 70px 10px 20px;
        padding: 20px;
        width: calc(100% - 20px);
      }

      .profile-info {
        flex-direction: column;
        text-align: center;
        gap: 15px;
      }

      .profile-stats-row {
        justify-content: center;
      }
      
      .stories-bar {
        padding: 12px 0;
      }
      
      .stories-container {
        padding: 0 10px;
        gap: 10px;
      }
      
      .story-avatar {
        width: 60px;
        height: 60px;
      }
      
      .top-nav {
        padding: 0 10px;
      }
      
      .nav-logo {
        font-size: 1.3rem;
      }
      
      .nav-icons {
        gap: 15px;
      }
      
      .nav-icon {
        font-size: 1.2rem;
      }
      
      .explore-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 2px;
        padding: 10px;
      }
      
      .video-container video {
        max-height: 500px;
      }
    }
    
    /* Small Mobile */
    @media (max-width: 480px) {
      .nav-icons {
        gap: 12px;
      }
      
      .nav-icon {
        font-size: 1.1rem;
      }
      
      .story-avatar {
        width: 56px;
        height: 56px;
      }
      
      .story-username {
        font-size: 0.7rem;
        max-width: 60px;
      }
      
      .post-header {
        padding: 10px 12px;
      }
      
      .post-actions {
        padding: 10px 12px;
      }
      
      .post-likes,
      .post-caption,
      .post-budget,
      .post-comments,
      .post-time {
        padding-left: 12px;
        padding-right: 12px;
      }
      
      .form-container {
        padding: 15px;
        margin: 70px 5px 20px;
        width: calc(100% - 10px);
      }
      
      .form-group label {
        font-size: 0.85rem;
      }
      
      .form-group input,
      .form-group textarea,
      .form-group select {
        padding: 8px 10px;
        font-size: 0.9rem;
      }
      
      .btn-primary {
        padding: 10px;
        font-size: 0.9rem;
      }
      
      .video-action-btn {
        width: 40px;
        height: 40px;
        font-size: 1.2rem;
      }
      
      .video-actions {
        right: 8px;
        bottom: 70px;
        gap: 12px;
      }
    }
    
    /* Extra Small Mobile */
    @media (max-width: 360px) {
      .nav-icons {
        gap: 10px;
      }
      
      .nav-icon {
        font-size: 1rem;
      }
      
      .story-avatar {
        width: 50px;
        height: 50px;
      }
      
      .bottom-nav {
        height: 55px;
      }
      
      .bottom-nav-item i {
        font-size: 1.3rem;
      }
      
      .bottom-nav-item span {
        font-size: 0.65rem;
      }
    }

    .hidden {
      display: none !important;
    }

    /* Status/Shorts Video Styles */
    .video-container {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }

    .video-container video {
      width: 100%;
      max-height: 600px;
      object-fit: contain;
      display: block;
    }

    .video-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 60px 16px 16px;
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
      color: white;
    }

    .video-actions {
      position: absolute;
      right: 12px;
      bottom: 80px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      z-index: 10;
    }

    .video-action-btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      color: white;
      font-size: 1.4rem;
      backdrop-filter: blur(10px);
    }

    .video-action-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.1);
    }

    .video-action-btn.liked {
      color: #ed4956;
    }

    .type-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-left: 8px;
    }

    .badge-status {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white;
    }

    .badge-shorts {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      color: white;
    }

    .comments-section {
      margin-top: 12px;
      padding: 12px;
      background: #fafafa;
      border-radius: 8px;
      max-height: 300px;
      overflow-y: auto;
    }

    .comment-item {
      padding: 8px;
      margin-bottom: 6px;
      background: white;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .comment-item strong {
      color: var(--ig-primary);
      margin-right: 6px;
    }

    .comment-item p {
      margin-top: 4px;
      font-size: 0.9rem;
    }

    .comment-item small {
      color: var(--text-secondary);
      font-size: 0.75rem;
    }

    /* Follow Button Styles */
    .follow-btn {
      padding: 8px 24px;
      border: 1px solid var(--border-color);
      background: var(--bg-secondary);
      color: var(--text-primary);
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
      margin-left: 12px;
    }

    .follow-btn:hover {
      background: var(--bg-primary);
      transform: scale(1.05);
    }

    .follow-btn.following {
      background: var(--ig-gradient);
      color: white;
      border-color: transparent;
    }

    .profile-action-btns {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <!-- Top Navigation -->
  <div class="top-nav">
    <div class="nav-logo" onclick="showSection('feed')">GigHub</div>
    <div class="nav-icons">
      <i class="fas fa-home nav-icon active" onclick="showSection('feed')" title="Home"></i>
      <i class="fas fa-search nav-icon" onclick="showSection('explore')" title="Explore"></i>
      <i class="fas fa-play-circle nav-icon" onclick="showSection('reels')" title="Reels"></i>
      <i class="fas fa-plus-circle nav-icon" onclick="showSection('create')" title="Create Post"></i>
      <i class="fas fa-upload nav-icon" onclick="showSection('upload')" title="Upload Status/Shorts"></i>
      <div style="position: relative;">
        <i class="fas fa-bell nav-icon" onclick="showNotifications()" title="Notifications"></i>
        <span id="notificationBadge" class="notification-badge" style="display: none;">0</span>
      </div>
      <i class="fas fa-moon nav-icon" id="darkModeIcon" onclick="toggleDarkMode()" title="Toggle Dark Mode"></i>
      <i class="fas fa-user-circle nav-icon" onclick="showSection('profile')" title="Profile"></i>
      <i class="fas fa-sign-out-alt nav-icon" onclick="logout()" title="Logout"></i>
    </div>
  </div>

  <!-- Stories Bar -->
  <div class="stories-bar" id="storiesBar">
    <div class="stories-container" id="storiesContainer">
      <!-- Stories will be loaded here -->
    </div>
  </div>

  <!-- Alert Container -->
  <div id="alertContainer" style="max-width: 600px; margin: 70px auto 0; padding: 0 20px;"></div>

  <!-- Main Content -->
  <div style="margin-top: 20px;">
    <!-- Feed Section -->
    <div id="feedSection" class="section active">
      <div class="feed-container" id="feedContainer">
        <!-- Posts will be loaded here -->
      </div>
    </div>

    <!-- Explore Section -->
    <div id="exploreSection" class="section">
      <div class="explore-grid" id="exploreGrid">
        <!-- Explore items will be loaded here -->
      </div>
    </div>

    <!-- Create Post Section -->
    <div id="createSection" class="section">
      <div class="form-container">
        <h2 style="margin-bottom: 24px; text-align: center;">Create New Post</h2>
        <form id="createPostForm">
          <div class="form-group">
            <label>Title *</label>
            <input type="text" id="postTitle" placeholder="e.g., Need a stunning wedding card design" required>
          </div>
          <div class="form-group">
            <label>Category *</label>
            <select id="postCategory" required>
              <option value="">Select Category</option>
              <option value="poster">Poster Design</option>
              <option value="banner">Banner Design</option>
              <option value="wedding-card">Wedding Card</option>
              <option value="website">Website Development</option>
              <option value="seo">SEO Services</option>
              <option value="logo">Logo Design</option>
              <option value="video">Video Editing</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label>Description *</label>
            <textarea id="postDescription" rows="5" placeholder="Describe your requirements in detail..." required></textarea>
          </div>
          <div class="form-group">
            <label>Budget *</label>
            <input type="text" id="postBudget" placeholder="e.g., $500 or ₹5000" required>
          </div>
          <div class="form-group">
            <label>WhatsApp Number (optional)</label>
            <input type="text" id="postWhatsapp" placeholder="e.g., +919876543210">
          </div>
          <div class="form-group">
            <label>Upload Images (optional, max 5)</label>
            <input type="file" id="postImages" multiple accept="image/*">
          </div>
          <button type="submit" class="btn-primary">Share Post</button>
        </form>
      </div>
    </div>

    <!-- Upload Status/Shorts Section -->
    <div id="uploadSection" class="section">
      <div class="form-container">
        <h2 style="margin-bottom: 24px; text-align: center;">Upload Status or Shorts</h2>
        <form id="statusShortsForm">
          <div class="form-group">
            <label>Type *</label>
            <select id="ssType" required>
              <option value="">Select Type</option>
              <option value="status">⏰ Status (Auto-deletes in 24 hours)</option>
              <option value="shorts">🎬 Shorts (Permanent)</option>
            </select>
          </div>
          <div class="form-group">
            <label>Media File * (Video or Image)</label>
            <input type="file" id="ssMedia" accept="video/*,image/*" required>
            <small style="color: var(--text-secondary); display: block; margin-top: 6px;">📹 Video (max 100MB) or 🖼️ Image</small>
          </div>
          <div class="form-group">
            <label>Caption (optional)</label>
            <textarea id="ssCaption" rows="3" placeholder="Add a caption..."></textarea>
          </div>
          <button type="submit" class="btn-primary">Upload</button>
        </form>
      </div>
    </div>

    <!-- Status/Shorts Feed Section -->
    <div id="reelsSection" class="section">
      <div class="feed-container" id="reelsContainer">
        <!-- Status/Shorts will be loaded here -->
      </div>
    </div>

    <!-- Activity Section -->
    <div id="activitySection" class="section">
      <div class="feed-container">
        <div class="post-card" style="padding: 40px; text-align: center;">
          <i class="fas fa-heart" style="font-size: 3rem; color: #ed4956; margin-bottom: 16px;"></i>
          <h3>Activity & Notifications</h3>
          <p style="color: var(--text-secondary); margin-top: 12px;">See likes and comments on your posts</p>
        </div>
      </div>
    </div>

    <!-- Profile Section -->
    <div id="profileSection" class="section">
      <div class="profile-header">
        <div class="profile-info">
          <div class="profile-avatar" id="profileAvatar">U</div>
          <div class="profile-stats">
            <div class="profile-username" id="profileUsername">username</div>
            <div class="profile-stats-row">
              <div class="stat-item">
                <div class="stat-number" id="profilePosts">0</div>
                <div class="stat-label">Posts</div>
              </div>
              <div class="stat-item">
                <div class="stat-number" id="profileFollowers">0</div>
                <div class="stat-label">Followers</div>
              </div>
              <div class="stat-item">
                <div class="stat-number" id="profileFollowing">0</div>
                <div class="stat-label">Following</div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="profile-bio">
        <div class="profile-name" id="profileName">User Name</div>
        <div class="profile-bio-text" id="profileBio">Freelancer on GigHub</div>
        <div class="profile-action-btns">
          <button class="btn-primary" style="flex: 1;" onclick="showSection('create')">Create Post</button>
          <button class="follow-btn" id="followBtn" onclick="followUser(currentUser.id, this)" style="display: none;">Follow</button>
        </div>
      </div>
      <div class="feed-container" id="profilePostsContainer">
        <!-- User's posts will be loaded here -->
      </div>
    </div>
  </div>

  <!-- Bottom Navigation (Mobile) -->
  <div class="bottom-nav">
    <div class="bottom-nav-item active" onclick="showSection('feed')">
      <i class="fas fa-home"></i>
      <span>Home</span>
    </div>
    <div class="bottom-nav-item" onclick="showSection('explore')">
      <i class="fas fa-search"></i>
      <span>Explore</span>
    </div>
    <div class="bottom-nav-item" onclick="showSection('reels')">
      <i class="fas fa-play-circle"></i>
      <span>Reels</span>
    </div>
    <div class="bottom-nav-item" onclick="showSection('upload')">
      <i class="fas fa-plus-square"></i>
      <span>Upload</span>
    </div>
    <div class="bottom-nav-item" onclick="showSection('profile')">
      <i class="fas fa-user-circle"></i>
      <span>Profile</span>
    </div>
  </div>

  <script src="/script.js"></script>
  <script>
    // Debug: Check if script.js loaded
    window.addEventListener('load', () => {
      console.log('=== DEBUG INFO ===');
      console.log('showSection exists:', typeof showSection === 'function');
      console.log('logout exists:', typeof logout === 'function');
      console.log('likePost exists:', typeof likePost === 'function');
      console.log('currentUser:', currentUser);
      console.log('==================');
      
      // Visual feedback that JS is loaded
      const alertContainer = document.getElementById('alertContainer');
      if (alertContainer) {
        // Brief success message
        const msg = document.createElement('div');
        msg.className = 'alert alert-success';
        msg.textContent = '✓ App loaded successfully!';
        msg.style.position = 'fixed';
        msg.style.top = '70px';
        msg.style.left = '50%';
        msg.style.transform = 'translateX(-50%)';
        msg.style.zIndex = '9999';
        alertContainer.appendChild(msg);
        
        setTimeout(() => {
          msg.remove();
        }, 2000);
      }
      
      if (typeof showSection !== 'function') {
        alert('ERROR: script.js failed to load!');
      }
    });
    
    // Make debugging easier
    window.testClick = function() {
      alert('Click working!');
    };
  </script>
</body>
</html>
